[package]
name = "tectonic-oqs-sys"
version = "0.11.1+liboqs-0.13.0"
authors = ["Thom Wiggers <thom@thomwiggers.nl>"]
edition = "2021"
links = "oqs"
description = "Bindings to liboqs"
readme = "../README.md"
repository = "https://github.com/tectonic-labs/liboqs-rust"
license = "MIT OR Apache-2.0"

# Exclude liboqs - it will be downloaded at build time
include = ["/README.md", "/build.rs", "/src/**"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0.2"
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }

[build-dependencies]
pkg-config = "0.3"
cmake = "0.1"
bindgen = "0.72"
build-deps = "0.1"

[features]
default = ["openssl", "kems", "sigs"]
openssl = []
vendored_openssl = ["openssl", "vendored", "dep:openssl-sys"]
docs = []
non_portable = []
vendored = []
# algorithms: KEMs
kems = ["classic_mceliece", "frodokem", "hqc", "kyber", "ml_kem", "ntruprime"]
bike = []  # BIKE is enabled by build.rs on non-windows targets
classic_mceliece = []
frodokem = []
hqc = []
kyber = []
ml_kem = []
ntruprime = []
# algorithms: Signature schemes
sigs = ["cross", "dilithium", "falcon", "mayo", "ml_dsa", "slh_dsa", "sphincs", "uov"]
cross = []
dilithium = []
falcon = []
mayo = []
ml_dsa = []
slh_dsa = []
sphincs = []
uov = []

[package.metadata.liboqs]
url = "https://github.com/tectonic-labs/liboqs.git"
tag = "tectonic/v0.15.1"

[package.metadata.docs.rs]
features = ["docs"]
